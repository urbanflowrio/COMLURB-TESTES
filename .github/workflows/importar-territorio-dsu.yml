name: Atualizar camadas publicas UCS UGU
on:
  push:
    branches: [main]
    paths: [.github/workflows/importar-territorio-dsu.yml]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Consultar ArcGIS institucional e criar arquivos por unidade
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.parse,pathlib
          endpoint='https://pgeo3.rio.rj.gov.br/arcgis/rest/services/Hosted/Bairros_limites_gerenciais_COMLURB/FeatureServer/0/query'
          params={'where':'1=1','outFields':'nome,area_plane,gerencia_12,gerencia_1','outSR':4326,'returnGeometry':'true','f':'geojson','resultRecordCount':2000}
          url=endpoint+'?'+urllib.parse.urlencode(params)
          req=urllib.request.Request(url,headers={'User-Agent':'COMLURB-TESTES/1.0'})
          with urllib.request.urlopen(req,timeout=45) as r: data=json.load(r)
          assert data.get('type')=='FeatureCollection',str(data)[:350]
          assert not data.get('exceededTransferLimit'),'Camada paginada'
          items=data.get('features',[])
          assert len(items)>=165 and len(items)<=400,len(items)
          for unit,key in [('ucs','gerencia_12'),('ugu','gerencia_1')]:
              fs=[]
              for f in items:
                  p=f.get('properties') or {}
                  if not p.get(key) or not f.get('geometry'):continue
                  fs.append({'type':'Feature','geometry':f['geometry'],'properties':{'nome':p.get('nome'),'area_plane':p.get('area_plane'),key:p[key]}})
              assert len(fs)>=160,(unit,len(fs))
              dst=pathlib.Path('inteligencia-territorial')/(unit+'.geojson')
              dst.write_text(json.dumps({'type':'FeatureCollection','features':fs},ensure_ascii=False,separators=(',',':')),encoding='utf-8')
              print(unit,len(fs),'features',dst.stat().st_size,'bytes')
          PY
      - name: Publicar camadas no repositorio de testes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inteligencia-territorial/ucs.geojson inteligencia-territorial/ugu.geojson
          if ! git diff --cached --quiet; then git commit -m "data(testes): atualiza UCS e UGU com geometria SIURB"; git push; fi
