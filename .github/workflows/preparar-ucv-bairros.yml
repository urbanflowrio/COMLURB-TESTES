name: Preparar cruzamento geográfico UCV bairros
on:
  push:
    branches: [main]
    paths: ['.github/workflows/preparar-ucv-bairros.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: urbanflowrio/COMLURB
          path: source/COMLURB
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install shapely pyproj
      - run: python scripts/gerar-ucv-intersecoes.py
      - name: Publicar dados derivados apenas no ambiente de testes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inteligencia-territorial/ucv_intersecoes.json
          if ! git diff --cached --quiet; then git commit -m "data(testes): intersecoes AP bairro UCV"; git push; fi
